[project]
name = "ovf-eval"
version = "0.1.0"
description = "Speech-to-text eval scorer and model bake-off for Open Voice Flow"
requires-python = ">=3.12"
dependencies = [
    "num2words>=0.5.13",
    "indic-transliteration>=2.3",
]

[project.optional-dependencies]
# Model runners. Heavy; only needed to produce transcripts, not to score them.
models = [
    "mlx-whisper>=0.4",
    "transformers>=4.46",
    "torch>=2.4",
    "soundfile>=0.12",
]

[project.scripts]
ovf-eval = "ovf_eval.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ovf_eval"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
# indic-transliteration uses the deprecated codecs.open(); not ours to fix.
filterwarnings = ["ignore::DeprecationWarning:indic_transliteration.*"]
